<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="robots" content="noindex, nofollow">

    <title>Create Account</title>

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900;1,1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link href="https://tradezanga.com/css/font-awesome-all.css" rel="stylesheet">
    <link href="https://tradezanga.com/css/flaticon.css" rel="stylesheet">
    <link href="https://tradezanga.com/css/style.css" rel="stylesheet">
    <link href="https://tradezanga.com/css/responsive.css" rel="stylesheet">
    <link href="https://tradezanga.com/css/auth.css" rel="stylesheet">
    <link rel="stylesheet" href="https://tradezanga.com/css/custom.css">
    <style>
        /* auth.css only styles text/password inputs, so match the email field */
        input[type="email"] {
            width: 100%;
            padding: 15px;
            margin: 5px 0 10px 0;
            display: inline-block;
            border: none;
            background: #303030b6;
            border-radius: 6px;
            font-family: var(--text-font);
            color: #f1f1f1;
        }
        input[type="email"]:focus {
            background: #5e5e5e8c;
            outline: none;
            color: #f1f1f1;
        }
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 4px 0 10px;
        }
        .terms-row input {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            margin-top: 4px;
        }
        .terms-row label {
            color: #bebbbb;
            font-size: 14px;
            line-height: 1.45;
        }
    </style>
</head>

<body>
    <div class="boxed_wrapper home_2">

        <!-- Modal -->
        <div id="modal">
            <div id="modal-content">
                <span id="modal-close" class="material-icons-sharp notranslate">close</span>
                <div id="modal-message">Placeholder</div>
            </div>
        </div>

        <form id="MainForm">
            <div class="container-wrapper">
                <div class="auth-container">
                    <h1 style="padding-bottom: 5px; margin-bottom: 26px; border-bottom: 1px solid #383838;">Create Account</h1>

                    <input type="text" placeholder="First Name" name="firstname" id="firstnameInp" autocomplete="given-name" required>
                    <input type="text" placeholder="Last Name" name="lastname" id="lastnameInp" autocomplete="family-name" required>
                    <input type="email" placeholder="Enter Email" name="email" id="emailInp" autocomplete="email" required>
                    <input type="password" placeholder="Enter Password" name="psw" id="passwordInp" autocomplete="new-password" required>
                    <input type="password" placeholder="Confirm Password" name="psw-confirm" id="confirmInp" autocomplete="new-password" required>

                    <p class="terms-row">
                        <input type="checkbox" id="termsInp" required>
                        <label for="termsInp">By creating an account, you agree to our <a href="#">Terms &amp; Privacy</a></label>
                    </p>

                    <div class="prewrap" style="display: flex; justify-content: center; height: 20px;">
                        <div class="circle-container" id="preloader" style="display: none;">
                            <div class="circle-progress"></div>
                        </div>
                    </div><br>

                    <button type="submit" style="margin-top: 0px;" class="registerbtn">Sign up</button>

                    <div class="container signin">
                        <p>Already have an account? <button type="button"><a href="index.html">Login</a></button></p>
                        <a href="https://tradezanga.com/">Home</a>
                    </div>
                </div>
            </div>
            <div class="auth-image"></div>
        </form>

    </div>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
