<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TradeZanga — Client Portal</title>
    <meta
      name="description"
      content="TradeZanga client portal: manage your investment packages, track requests and follow the markets."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="TradeZanga" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TradeZanga" />
    <meta name="theme-color" content="#fbfbfa" />
    <script>
      // Capture the install event before React mounts so the in-app prompt
      // never misses it.
      window.__deferredPwaPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__deferredPwaPrompt = event;
        window.dispatchEvent(new Event("tz-pwa-prompt-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new Event("tz-pwa-installed"));
      });
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tz-theme");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
            if (meta) meta.setAttribute("content", "#101713");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
            if (meta) meta.setAttribute("content", "#fbfbfa");
          }
        } catch (error) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Marketing site fonts (frontz): Syne for titles, Mulish for text -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;0,1000;1,300;1,400;1,500;1,600;1,700;1,800;1,900;1,1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
